[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
markers =
    llm: live or injected LLM decision/counsel paths (opt-in; skipped without key/flag)
    rule: rule-based / heuristic OCEAN AI (default CI path)
filterwarnings =
    ignore::DeprecationWarning
